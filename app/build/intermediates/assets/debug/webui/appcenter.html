<html>
  <meta charset="utf-8" >
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="js/jquery-1.9.0.js" type="text/javascript"></script>
<script src="js/FavApps.js" type="text/javascript"></script>
<script src="js/Sortable.min.js"></script>
<link id="theme" rel="stylesheet" href="css/dark_theme.css">
<link rel="stylesheet" href="css/main.css">
<style>
.mask,.app-popup{
    display: block;
}
.app-popup{
    height: 570px;
}
.app-popup .app-list {
    width: auto;
}
.app-popup .app-list ul {
    width: calc(100vw - 120px);
}
.loading{
    margin-left: calc(50vw - 105px);
    margin-top: 250px;
}
.app-menu{
    width: 264px;
    height: 70px;
}
.app-menu::after {
    left: 122px;
    bottom: 55px;
}
.app-menu p {
    width: 60px;
    height: 70px;
    text-align: center;
}
.app-menu img {
    height: 40px;
    filter: drop-shadow(0px 40px var(--popup_bg_color));
    margin-top: -40px;
    margin-bottom: 42px;
}
.app-menu p span{
    color: var(--popup_bg_color);
}
@media (orientation: portrait ){
    .app-popup{
        height: 1040px;
    }
    .app-popup .app-list ul {
        margin-left: -15px;
    }
}
</style>
<body>
    <div class="appcenter-container">
        <div class="mask"></div>
        <div id="app-popup" class="app-popup">
            <div class="app-list">
                <ul>
                    <div class="loading"></div>
                </ul>
            </div>
        </div>
        <div class="app-menu">
            <p class="app_fav">
                <img src="img/thumb/icon_app_fav.svg">
                <span>收藏</span>
            </p>
            <p class="app_add">
                <img src="img/thumb/icon_app_add.svg">
                <span>常用</span>
            </p>
            <p class="app_info">
                <img src="img/thumb/icon_app_info.svg">
                <span>详情</span>
            </p>
            <p class="app_del">
                <img src="img/thumb/icon_app_del.svg">
                <span>删除</span>
            </p>
        </div>
    </div>
</body>
<script>
const LOCAL_HOST = "http://localhost:8080";

$(function() {
    var startTime,endTime,timer;
    window.favApps = new FavApps();
    favApps.updateAllAppList(0);

    $("#app-popup").on('touchstart', 'li', function(event){
        startTime = +new Date();
        this.startY = event.originalEvent.changedTouches[0].clientY;
        $('.app-menu').hide();
        $('.app-menu').css('left', $(this).offset().left - 87);
        $('.app-menu').css('top', $(this).offset().top + 95);	
        $(this).addClass("tap");
        timer = setTimeout(()=>{
            $(this).removeClass("tap");
            $(this).addClass("longtap");
        }, 700);
      }).on('touchend', 'li', function(event){
        var yDist = this.startY - event.originalEvent.changedTouches[0].clientY;
        event.preventDefault();	
        endTime = +new Date();
        //console.log($(this));
        var pkg = $(this).attr('pkg');
        var curClass = $(this)[0].parentElement.parentElement.className;
        if (endTime - startTime < 700){
            $(this).removeClass("tap");
            clearTimeout(timer);
            if(pkg && Math.abs(yDist) < 30) {
                pkg == "launcher3" ? window.carJsBridge.sysBtnEvent("bydhome") : window.carJsBridge.sendCommand('{"cmd":"openApp", "pkgName":"'+ pkg +'"}');
                window.carJsBridge.sysBtnEvent("appcenter");
            }
        }else{
            if(Math.abs(yDist) > 30) return;
            var name = $(this)[0].children[1].innerText;
            $('.app-menu').attr("data-pkg",pkg);
            $('.app-menu').css('display','inline-flex');
            $('.app-menu p').off('click').on('click', function(ev) {
                var option = $(this)[0].className;
                switch(option){
                    case 'app_fav':
                        favApps.saveData(pkg, name);
                        break;
                    case 'app_add':
                        favApps.saveNaviData(pkg, name);
                        break;                 
                    case 'app_info':
                        window.carJsBridge.showAppDetails(pkg);
                        break;
                    case 'app_del':
                        window.carJsBridge.sendCommand('{"cmd":"delApp", "pkgName":"'+ pkg +'"}');
                        break;
                }
                $('.app-menu').hide();
                window.carJsBridge.sysBtnEvent("appcenter");
            });
            $('.app-popup').off('click').on('click', function(ev) {
                $('.app-menu').hide();
            });
            $(this).removeClass("longtap");
        }
      });

      $(".mask").on('touchstart', function(event){
        window.carJsBridge.sysBtnEvent("appcenter");
      });
});
</script>
</html>
