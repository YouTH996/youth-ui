<script>
var parentWindow = window.parent;
var map_pkg = parentWindow.car.local("system_widget_app_map");
var music_pkg = parentWindow.car.local("system_widget_app_music");
var img_pre = "/appicon/";
var fx = function(o){return document.querySelector(o)};
if(window.carJsBridge.config("UI_THEME") === 0){
    var theme = "./css/light_theme.css";
    $("#theme", parentWindow.document).attr("href", theme);
    $("#theme").attr("href", theme);
}
updateWidgetLayout(Math.random());

function updateMusic(time){
    music_pkg = parentWindow.global("mt_app") || parentWindow.car.local("system_widget_app_music");
    if(parentWindow.global("mt_app") != "null" && parentWindow.global("mt_title") != null){
        let play_status = parentWindow.global("mt_isplaying") == "true" ? "play" : "pause";//播放状态 正在播放为play
        let mt_cover = parentWindow.global("mt_cover") != "null" ? parentWindow.global("mt_cover") : img_pre + music_pkg;
        if(mt_cover != null && mt_cover.startsWith("http")){
            mt_cover = window.carJsBridge.config("system_music_online_access_mode") != 1 && !mt_cover.startsWith("http://liszt") ? img_pre + music_pkg : mt_cover;
        }
        if(mt_cover.startsWith("content://")) mt_cover = mt_cover.replace("content://","http://content/");
        fx('.music__info--lyric ul').innerHTML = '';
        fx('.music__info--title').innerHTML = parentWindow.global("mt_title")+ '<span>'+ parentWindow.global("mt_artist").replace("null","") +'</span>';
        var txt_state = $(".music__info--title").width() > 210 ?  "play" : "pause";
        var blur_image = parentWindow.global("player_blur_show") == 0 ? "" : "url('"+ mt_cover +"')";
        $('.music-player__image').show();
        fx('.music-player__image img').src = mt_cover;
        fx('.music-player__blur').style.backgroundImage = blur_image;
        if(parentWindow.global("player_widget_clone") == 1){
            $('.music-player__image', parentWindow.document).show();
            $('.music-player__image img', parentWindow.document).attr('src', mt_cover);
            $('.music-player__blur', parentWindow.document).css('background', blur_image);
        }
        fx('.music-player__image').className = 'music-player__image '+ play_status;
        fx('.music-player__pointer').className = 'music-player__pointer '+ play_status;
        fx('.music__info--title').className = 'music__info--title '+ txt_state;
        fx('.player-control__btn--play').style.backgroundImage = "url('./img/widget/music_btn_"+ play_status +".png')";
        fx('.player-control__btn--logo').style.backgroundImage = "url('"+ img_pre + music_pkg +"')";
        parentWindow.car.cloneWidget("player");
        $(".player_widget .player-control__btn--logo", parentWindow.document).css("transform","none");
    }
}
parentWindow.car.cloneWidget("player");
function updateCarInfo(time){
    var tire_values = [parentWindow.global("TYRE_PRESSURE_VALUE_RIGHT_FRONT"), parentWindow.global("TYRE_PRESSURE_VALUE_LEFT_FRONT"), parentWindow.global("TYRE_PRESSURE_VALUE_RIGHT_REAR") ,parentWindow.global("TYRE_PRESSURE_VALUE_LEFT_REAR")];
    $(".car-tire__info li o").each(function(index,domEle){
        $(domEle).text(tire_values[index]);
    });
}
function updateACInfo(time){
    var ac_cur_temp = parentWindow.global("AC_TEMP_MAIN") || 23,
        ac_cur_wind = parentWindow.global("AC_WIND_LEVEL") || 0,
        ac_status = parentWindow.global("AC_POWER_STATE") == "1" ? "_on" : "_off",
        isdark = /dark/.test(parentWindow.global("THEME")) && parseInt(ac_cur_wind) < 1 ? "_dark" : "";
        imgIsdark =  parentWindow.global("THEME") == null || /dark/.test(parentWindow.global("THEME")) ? "_dark" : "";
    $(".carac__info .temp").text(ac_cur_temp);
    $(".carac__info .wind").css("background-image",`url('./img/navbar/ac_bar_wind_level_${ac_cur_wind}${ac_status}${isdark}.png')`);
    $(".carac__info .wind img").attr('src', `./img/navbar/air_control_wind_cc${imgIsdark}.png`);
    $(".carac__info .wind img").css("animation",`${parseInt(ac_cur_wind) > 0 && 'rotation 1s linear infinite'}`);
}
function updateFavAppList(time){
    var app_list = JSON.parse(window.carJsBridge.local("favAppData") || "{}"),
        app_count = app_list ? Object.keys(app_list).length : 0,
        widget_width = app_count*71+110;
    $(".app-favorite p").html("");
    for(let pkg in app_list){       
        var pkglogo = pkg == "launcher3" ? "./img/thumb/ic_flat_launcher.png" : img_pre + pkg;
        $(".app-favorite p").prepend('<img src="' + pkglogo +'">');
    }
    $(".app-favorite").css("width",`${widget_width}px`);
}
function updateWidgetAppList(time){
    var widget_app_list = JSON.parse(window.carJsBridge.local("naviAppData") || "{}");
    for(let pkg in widget_app_list){       
        var pkglogo = pkg == "launcher3" ? "./img/thumb/ic_flat_launcher.png" : img_pre + pkg;
        if(!document.getElementById(pkg)){
            $(".app-favorite").before(`<div id="${pkg}" draggable='true' class="widget widget_app">
                <img src="${pkglogo}">
                <span>${widget_app_list[pkg]}</span>
            </div>`);
        }
    }
}
function delAppData(key,pkg){
    var appData = JSON.parse(window.carJsBridge.local(key));
    delete appData[pkg];
    window.carJsBridge.setLocal(key,JSON.stringify(appData));
}
function updateWidgetLayout(time){
    var theme_style = parentWindow.global("theme_style");
    if(theme_style){
        var style = JSON.parse(theme_style);
        $.each(style, function(key,val) {
            if(key == "widget_bg_opacity") val = val/100;
            if(key == "widget_border_radius") val = val+"px";
            if(key == "widget_blur"){
                val = val > 0 ? "blur("+ val +"px)" : "";
                $(".widget-container .widget").css("backdrop-filter",val);
            }else if(key == "widget_margin_right"){
                $(".widget-container .widget").css("margin-right", val+"px");
            }else{
                document.documentElement.style.setProperty("--"+key, val);
                parentWindow.document.documentElement.style.setProperty("--"+key, val);
            }
        });
    }
    parentWindow.global("player_mini_lyric_show") == 0 ? $(".music__info--lyric").hide() : $(".music__info--lyric").show();
    parentWindow.global("car_tire_widget_show") == 0 ? $(".car-tire").hide() : $(".car-tire").show();
    (parentWindow.global("weather_widget_show") == 0 || parentWindow.global("weather_widget_clone") == 1) ? $(".weather").hide() : $(".weather").show();
}

updateFavAppList(0);
updateWidgetAppList(0);

function weather(time) {
    parentWindow.car.getCurLunar(new Date());
    var weatherData = window.carJsBridge.local("WEATHER_DATA");
    if(weatherData){
        var data = weatherData.split("_");
        if(data.length < 13) return;
        var isNight = isSunriseSunset(new Date, new Date(formatTime(data[7])), new Date(formatTime(data[8])));
        $('.weather__summary .temp o').text(data[2]);
        $('.weather__summary .temp t').text(`${data[3]}℃ /${data[4]}℃`);
        $('.weather__summary .capinfo p').text(data[1]);
        $('.weather__summary .capinfo i').attr("class","aqi_level aqi_level_"+ data[11]);
        $('.weather__summary .capinfo o').text(data[10] +" "+ data[12].replace("污染",""));
        $(".weather__ico img").attr('src', getWeaIconByZmCode(data[5],isNight));
        $(".digital-clock .weather-info", parentWindow.document).html(`${data[1]}&nbsp;&nbsp;${data[4]}℃~${data[3]}℃&nbsp;&nbsp;&nbsp;&nbsp;${data[0]}`);
        parentWindow.car.cloneWidget("weather");
    }
}
weather(0);

var m_flag = true;
$(".car-thumb").click(function(){
    var car_model_show = parentWindow.global("car_model_show") || 0;
    var time_cards_show_mode = parentWindow.global("time_cards_show_mode") || 1;
    var car_ctrl_cards_show_mode = parentWindow.global("car_ctrl_cards_show_mode") || 1;
    var words_day_show = parentWindow.global("words_day_show") || 0;
    if(m_flag){
        $("#carinfo-lock").animate({width:`${parentWindow.global("car_ctrl_widget_width") || 285}px`});
        time_cards_show_mode == 1 && $(".digital-clock", parentWindow.document).hide();
        words_day_show == 1 && $(".words-day", parentWindow.document).hide();
        car_model_show == 1 && $("#box", parentWindow.document).fadeIn(1000);
        car_ctrl_cards_show_mode == 1 && $("#card-container", parentWindow.document).fadeIn(1000);
        car_model_show > 0 && parentWindow.car.initDoor();
        m_flag = false;
        parentWindow.car.refreshAmap(0);
    }else{
        time_cards_show_mode == 1 && $(".digital-clock", parentWindow.document).fadeIn(1000);
        words_day_show == 1 && $(".words-day", parentWindow.document).fadeIn(1000);
        $("#carinfo-lock").animate({width:"285px"});
        car_model_show == 1 && $("#box", parentWindow.document).fadeOut(1000);
        car_ctrl_cards_show_mode == 1 && $("#card-container", parentWindow.document).hide();
        m_flag = true;
        parentWindow.car.refreshAmap(1);
    }
});

    music_pkg = parentWindow.global("mt_app") || parentWindow.car.local("system_widget_app_music");

    var action_list = ["PREVIOUS", play_pause_key, "NEXT"];
    i == 3 ? parentWindow.car.toggleCloneWidget("player",1) : parentWindow.car.mediaControl(action_list[i]);
});

$(".ico_setting").click(function(){

    parentWindow.global("time_cards_position") && $(".time_cards_show", parentWindow.document).css("background", "rgba(0, 0, 0, 0.25)");
    parentWindow.global("car_ctrl_cards_position") && $(".car_ctrl_cards_show", parentWindow.document).css("background", "rgba(0, 0, 0, 0.25)");
    parentWindow.car.refreshAmap(0);
});
var clicktime = +new Date();
var timer;
$(".app-favorite p").on('click', 'img', function(event){  
    clearTimeout(timer);
    let index = $(this)[0].src.lastIndexOf("\/"); 
    var pkg = $(this)[0].src.substring(index+1);  
    timer = setTimeout(function () {
        pkg == "ic_flat_launcher.png" ? window.carJsBridge.sysBtnEvent("bydhome") : parentWindow.car.loadApp(pkg);
    }, 400);
    if((+new Date()) - clicktime < 400 ){
        if(pkg == "ic_flat_launcher.png") pkg = "launcher3";
        delAppData("favAppData",pkg);
        clearTimeout(timer);
    }else{
        clicktime = +new Date();
    }
});
$(".widget-container").on('click', '.widget_app', function(event){
    clearTimeout(timer);
    var pkg = $(this).attr("id");
    timer = setTimeout(function () {
        pkg == "launcher3" ? window.carJsBridge.sysBtnEvent("bydhome") : parentWindow.car.loadApp(pkg);
    }, 400);
    if((+new Date()) - clicktime < 400 ){
        delAppData("naviAppData",pkg);
        $(this).remove();
        clearTimeout(timer);
    }else{
        clicktime = +new Date();
    }
});

$(".carac__info img").on('click', function(e){
    e.stopPropagation();
    var i = $(".carac__info img").index(this),
        ac_cur_temp = parseInt(parentWindow.global("AC_TEMP_MAIN")) || 22,
        ac_cur_wind = parseInt(parentWindow.global("AC_WIND_LEVEL")) || 0,
        op = i < 2 ? "AC_TEMP_MAIN_SET" : "AC_WIND_LEVEL_SET",
        value;
    switch(i){
        case 0:
            value = ac_cur_temp - 1;
            break;
        case 1:
            value = ac_cur_temp + 1;
            break;
        case 2:
            value = ac_cur_wind - 1;
            break;
        case 4:
            value = ac_cur_wind + 1;
            break;
    }
    if(value>=0) parentWindow.car.acFastControl(op, value);
});

parentWindow.car.updateCardList("ctrl_cards_widget");
new Sortable($('#widget-container')[0], {
    animation: 150,
    chosenClass: 'blue-background-class',
    delayOnTouchOnly: true, //开启触摸延时
    delay: 500, //延时时长
    touchStartThreshold: 3,
    store: {
        get: function (sortable) {
            var order = parentWindow.global("widget_order");
            return order ? order.split('|') : [];
        },
        set: function (sortable) {
            var order = sortable.toArray();
            parentWindow.setGlobal("widget_order", order.join('|'));
        }
    }
});
</script>
</body>
</html>
